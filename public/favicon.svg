<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="50%" stop-color="#b5893d"/>
      <stop offset="100%" stop-color="#88451b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#163820" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ivory Background Circle -->
  <circle cx="64" cy="64" r="61" fill="#faf6ee" stroke="url(#goldRim)" stroke-width="4" filter="url(#softGlow)"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#c59b4e" stroke-width="1.2" opacity="0.6"/>

  <!-- First 'R' in Forest Henna Green -->
  <text x="24" y="78" fill="#163820" font-size="54" font-weight="900" font-family="'Playfair Display', Georgia, serif">R</text>

  <!-- Second 'R' in Terracotta Henna Copper -->
  <text x="54" y="78" fill="#88451b" font-size="54" font-weight="900" font-family="'Playfair Display', Georgia, serif">R</text>

  <!-- Golden Henna Leaf Accent -->
  <path d="M60 30 C64 24 72 24 74 32 C74 38 66 42 60 30 Z" fill="#c59b4e" opacity="0.9"/>
  <path d="M68 34 C72 30 78 30 79 36 C79 40 73 43 68 34 Z" fill="#163820" opacity="0.85"/>

  <!-- Lotus Motif Bottom Center -->
  <g transform="translate(64, 100) scale(0.6) translate(-64, -100)">
    <path d="M64 88 C60 96 52 102 64 108 C76 102 68 96 64 88 Z" fill="#88451b"/>
    <path d="M50 94 C46 100 48 106 60 108 C54 102 52 98 50 94 Z" fill="#163820"/>
    <path d="M78 94 C82 100 80 106 68 108 C74 102 76 98 78 94 Z" fill="#163820"/>
    <circle cx="64" cy="113" r="2.5" fill="#c59b4e"/>
  </g>
</svg>